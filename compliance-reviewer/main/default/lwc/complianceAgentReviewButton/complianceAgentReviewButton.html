<!--
  @description       : Lightning Record Page component that detects the current record/object, shows the file picker when applicable, 
                       and triggers the analysis via Apex.
  @author            : ChangeMeIn@UserSettingsUnder.SFDoc
  @group             : 
  @last modified on  : 08-13-2026
  @last modified by  : ChangeMeIn@UserSettingsUnder.SFDoc
-->
<template>
    <lightning-card title="Compliance Agent" icon-name="standard:contract">
        <div class="slds-p-around_small">
            <template if:true={hasError}>
                <div class="slds-text-color_error slds-m-bottom_small">{error}</div>
            </template>

            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_x-small">
                <span></span>
                <lightning-button-icon
                    icon-name="utility:refresh"
                    alternative-text="Refresh file list"
                    title="Refresh file list"
                    onclick={handleRefresh}
                    size="small"
                    disabled={isProcessing}>
                </lightning-button-icon>
            </div>

                <template if:true={hasFiles}>
                    <lightning-combobox
                        label="Select the contract to analyze"
                        options={fileOptions}
                        onchange={handleFileChange}
                        value={selectedContentVersionId}
                        class="slds-m-bottom_medium"
                        disabled={isProcessing}>
                    </lightning-combobox>
                </template>
                <template if:false={hasFiles}>
                    <p class="slds-m-bottom_medium">There are no contracts available to review yet. Upload a PDF contract to this record and click refresh.</p>
                </template>
          
            <lightning-button
                variant="brand"
                label="Review Contract"
                onclick={handleAnalyze}
                disabled={isAnalyzeDisabled}
                class="slds-m-top_medium slds-m-bottom_small">
            </lightning-button>

            <template if:true={isProcessing}>
                <div class="slds-is-relative slds-p-around_medium" style="min-height: 4rem;">
                    <lightning-spinner alternative-text="Analyzing contract..." size="medium"></lightning-spinner>
                </div>
                <p class="slds-text-body_small slds-text-color_weak slds-text-align_center slds-m-bottom_small">
                    Analyzing the contract against your Salesforce data — this can take up to a minute for longer documents. Please don't close this tab.
                </p>
            </template>
        </div>
    </lightning-card>
</template>
